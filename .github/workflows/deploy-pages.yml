name: Build Pages bundle

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check types and style
        run: npm run lint
      - name: Test training
        run: npm run test:training
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /digital-master-sheet-pages/
      - name: Upload Pages bundle
        uses: actions/upload-artifact@v4
        with:
          name: pages-site
          path: dist
